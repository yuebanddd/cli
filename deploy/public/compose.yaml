name: pippit-public
services:
  postgres:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: pippit
      POSTGRES_USER: pippit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U pippit -d pippit]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: ../..
      dockerfile: deploy/public/Dockerfile
    image: pippit-public:local
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://pippit:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/pippit?sslmode=disable
      PIPPIT_PUBLIC_ISSUER: https://${PUBLIC_HOST:?set PUBLIC_HOST}
      PIPPIT_PUBLIC_CLIENTS_JSON: ${PIPPIT_PUBLIC_CLIENTS_JSON:?set exact OAuth client and callbacks}
      PIPPIT_LOGIN_ISSUER: ${PIPPIT_LOGIN_ISSUER:?set service login OIDC issuer}
      PIPPIT_LOGIN_CLIENT_ID: ${PIPPIT_LOGIN_CLIENT_ID:?set service login OIDC client}
      PIPPIT_LOGIN_CLIENT_SECRET: ${PIPPIT_LOGIN_CLIENT_SECRET:?set service login OIDC secret}
      PIPPIT_CREDENTIAL_MASTER_KEY: ${PIPPIT_CREDENTIAL_MASTER_KEY:?set 32-byte base64 key}
      PIPPIT_TRUSTED_PROXY_CIDRS: 172.30.19.10/32
    read_only: true
    tmpfs:
      - /var/cache/pippit:size=4294967296,mode=0700,uid=1000,gid=1000
      - /tmp:size=67108864,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    stop_grace_period: 20s

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?set PUBLIC_HOST}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      default:
        ipv4_address: 172.30.19.10

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.19.0/24

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
