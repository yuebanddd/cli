name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  canvas-command:
    name: Canvas command (Node ${{ matrix.node-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - "16"
          - "20"
        os:
          - ubuntu-22.04
          - windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Test canvas command
        run: node scripts/canvas-command.test.js

      - name: Test runtime artifact assembly
        run: node scripts/prepare-canvas-runtime.test.js

  go:
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: publicapp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d publicapp_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://test:test@localhost:5432/publicapp_test?sslmode=disable
    name: Go tests
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go test -race ./...

      - run: go build ./...

      - run: go vet ./...
